# Faz o papel do Kong: um único endereço para /auth/v1 (GoTrue) e /rest/v1 (PostgREST).
server {
  listen 80;
  client_max_body_size 50m;
  resolver 127.0.0.11 valid=5s;
  location ~ ^/auth/v1/(.*)$ { set $up http://auth:9999; proxy_pass $up/$1$is_args$args; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; }
  location ~ ^/rest/v1/(.*)$ { set $up http://rest:3000; proxy_pass $up/$1$is_args$args; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; }
}
