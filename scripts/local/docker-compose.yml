# Cópia local do Norte ERP: mesma montagem da produção (Postgres + GoTrue + PostgREST atrás de um proxy de
# /auth/v1 e /rest/v1, como o Kong) + frio-api. Portas só em 127.0.0.1: Postgres 54420, API 54421, frio-api 54422.
# Segredos vêm de .local-data/env (gerado por scripts/local/local.sh subir). Nada aqui toca a produção.
name: ntb-erp-local
services:
  db:
    image: supabase/postgres:17.6.1.066
    container_name: ntb-erp-local-db
    restart: unless-stopped
    ports: ["127.0.0.1:54420:5432"]
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXP: "3600"
    volumes:
      - ntb_erp_local_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -h 127.0.0.1"]
      interval: 3s
      timeout: 3s
      retries: 40
  auth:
    image: supabase/gotrue:v2.192.0
    container_name: ntb-erp-local-auth
    restart: unless-stopped
    depends_on: { db: { condition: service_healthy } }
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: "9999"
      API_EXTERNAL_URL: http://127.0.0.1:54421
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      GOTRUE_SITE_URL: http://127.0.0.1:3107
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_EXP: "3600"
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_SMTP_HOST: ""
  rest:
    image: postgrest/postgrest:v12.2.12
    container_name: ntb-erp-local-rest
    restart: unless-stopped
    depends_on: { db: { condition: service_healthy } }
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public,storage
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"
  proxy:
    image: nginx:1.27-alpine
    container_name: ntb-erp-local-proxy
    restart: unless-stopped
    depends_on: [auth, rest]
    ports: ["127.0.0.1:54421:80"]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
  frio:
    image: node:22-alpine
    container_name: ntb-erp-local-frio
    restart: unless-stopped
    depends_on: { db: { condition: service_healthy } }
    ports: ["127.0.0.1:54422:3001"]
    working_dir: /srv
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/frio
      VENDAS_DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/frio
      API_KEY: ${FRIO_API_KEY}
      VENDAS_API_KEY: ${FRIO_API_KEY}_vendas
      PORT: "3001"
      NODE_PATH: /srv/node_modules
    volumes:
      - ../../desktop/frio-api/server.js:/app/server.js:ro
      - ntb_erp_local_frio_modules:/srv
    command: >
      sh -c "([ -d node_modules/express ] || npm i --no-audit --no-fund express pg dotenv) && sed 's/127.0.0.1/0.0.0.0/' /app/server.js > /srv/server.js && node /srv/server.js"
volumes:
  ntb_erp_local_pg:
  ntb_erp_local_frio_modules:
