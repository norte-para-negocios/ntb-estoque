name: Sync Omie

# Mantem o sistema sincronizado com o Omie automaticamente, sem clicar.
# Camada 1 (tempo real): webhook do Omie (configurado nas lojas).
# Camada 2 (rede de seguranca): este cron frequente.

on:
  schedule:
    - cron: '*/10 * * * *' # a cada 10 min
  workflow_dispatch: {}

concurrency:
  group: sync-omie
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Disparar sincronizacoes
        env:
          BASE: https://ntb-estoque.vercel.app
          SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SECRET" ]; then echo "CRON_SECRET nao configurado nos secrets do repo"; exit 1; fi
          # Minuto como decimal (10# evita erro de octal em 08/09) e bloco de 10 min (0..5).
          # O cron */10 dispara ~min 00/10/20/30/40/50, mas o GitHub atrasa de forma
          # variavel, entao comparamos por JANELA de 10 min, nao por igualdade exata.
          min=$(date -u +%M)
          bloco=$(( 10#$min / 10 ))
          hit() { echo "-> $1"; curl -s -m 120 -o /dev/null -w "   http %{http_code}\n" -H "Authorization: Bearer $SECRET" "$BASE$1" || true; }
          # Sempre: notas fiscais e ordens de producao (mudam ao longo do dia)
          hit /api/cron/sync-nfs
          hit /api/cron/sync-ops
          # Posicao de estoque (CMC): toda execucao processa 1 loja (a mais atrasada),
          # cobrindo todas as lojas em rodizio a cada ~1h sem estourar o tempo.
          hit /api/cron/sync-posicao
          # Locais de estoque: 2x por hora (bloco 0 = inicio da hora, bloco 3 = meia hora)
          if [ "$bloco" -eq 0 ] || [ "$bloco" -eq 3 ]; then hit /api/cron/sync-locais; fi
          # Produtos: 1x por hora (bloco 0 = primeira execucao da hora)
          if [ "$bloco" -eq 0 ]; then hit /api/cron/sync-produtos; fi
