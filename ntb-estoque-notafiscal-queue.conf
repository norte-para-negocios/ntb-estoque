[program:ntb_estoque_notafiscal_queue]
process_name=%(program_name)s_%(process_num)02d
command=/opt/plesk/php/8.4/bin/php /var/www/vhosts/valuable.com.br/ntb.bahiash.com.br/artisan queue:work --queue=notafiscal --tries=5 --timeout=3600 --memory=512
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=myUser
numprocs=8
redirect_stderr=true
stdout_logfile=/var/www/vhosts/valuable.com.br/logs/ntb.bahiash.com.br/notafiscal-queue-worker.log
stopwaitsecs=3600
